<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" width="1080" height="340">
<rect width="1080" height="340" fill="#F8FAFC" rx="18"/>


  <g transform="translate(20,0)">
    <rect x="0" y="0" width="520" height="340" rx="14" fill="#fff" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="16" y="14" width="62" height="24" rx="12" fill="#DC2626"/>
    <text x="47" y="31" text-anchor="middle" font-family='DM Sans, Inter, Arial, sans-serif' font-size="12" font-weight="700" fill="#fff">✗ MAL</text>
    <text x="504" y="31" text-anchor="end" font-family='DM Sans, Inter, Arial, sans-serif' font-size="12" fill="#64748B">Gris sobre gris (2.1:1)</text>
  </g>
<g transform="translate(20,0)">
  <rect x="40" y="60" width="440" height="200" rx="12" fill="#E5E7EB"/>
  <text x="64" y="104" font-family='Space Grotesk, Arial, sans-serif' font-size="22" font-weight="700" fill="#A3A3A3">Planes y precios</text>
  <text x="64" y="134" font-family='DM Sans, Inter, Arial, sans-serif' font-size="14" fill="#B5B5B5">Elige el plan que mejor se adapte a ti.</text>
  <text x="64" y="156" font-family='DM Sans, Inter, Arial, sans-serif' font-size="14" fill="#B5B5B5">Sin compromiso, cancela cuando quieras.</text>
  <rect x="64" y="190" width="150" height="40" rx="8" fill="#C4B5FD"/><text x="139" y="215" text-anchor="middle" font-family='DM Sans, Inter, Arial, sans-serif' font-size="14" font-weight="600" fill="#fff">Elegir plan</text>
  <text x="40" y="300" font-family='DM Sans, Inter, Arial, sans-serif' font-size="12" fill="#64748B">Texto gris claro sobre fondo gris: no pasa 4.5:1. Botón lavado.</text>
</g>

  <g transform="translate(560,0)">
    <rect x="0" y="0" width="520" height="340" rx="14" fill="#fff" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="16" y="14" width="68" height="24" rx="12" fill="#16A34A"/>
    <text x="50" y="31" text-anchor="middle" font-family='DM Sans, Inter, Arial, sans-serif' font-size="12" font-weight="700" fill="#fff">✓ BIEN</text>
    <text x="504" y="31" text-anchor="end" font-family='DM Sans, Inter, Arial, sans-serif' font-size="12" fill="#64748B">Contraste ≥ 4.5:1</text>
  </g>
<g transform="translate(560,0)">
  <rect x="40" y="60" width="440" height="200" rx="12" fill="#fff" stroke="#E2E8F0"/>
  <text x="64" y="104" font-family='Space Grotesk, Arial, sans-serif' font-size="22" font-weight="700" fill="#1E293B">Planes y precios</text>
  <text x="64" y="134" font-family='DM Sans, Inter, Arial, sans-serif' font-size="14" fill="#475569">Elige el plan que mejor se adapte a ti.</text>
  <text x="64" y="156" font-family='DM Sans, Inter, Arial, sans-serif' font-size="14" fill="#475569">Sin compromiso, cancela cuando quieras.</text>
  <rect x="64" y="190" width="150" height="40" rx="8" fill="#F97316"/><text x="139" y="215" text-anchor="middle" font-family='DM Sans, Inter, Arial, sans-serif' font-size="14" font-weight="600" fill="#fff">Elegir plan</text>
  <text x="40" y="300" font-family='DM Sans, Inter, Arial, sans-serif' font-size="12" fill="#64748B">#1E293B sobre blanco = 14:1. Texto secundario #475569 = 7.6:1.</text>
</g>
</svg>